<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sunybot - Elevator Assistant</title>

  <!-- Favicon (cache-bust nếu cần: ?v=2) -->
  <link rel="icon" href="/static/favicon.ico?v=1">

  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f5f6f8; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 18px; }
    .header { background:white; padding:14px 16px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .title { font-size:18px; font-weight:700; }
    .sub { color:#666; margin-top:6px; font-size:13px; }
    .chat { margin-top:14px; background:white; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); height: 70vh; display:flex; flex-direction:column; }
    .msgs { padding:16px; overflow:auto; flex:1; }
    .row { margin-bottom:6px; display:flex; }
    .me { justify-content:flex-end; }
    .bot { justify-content:flex-start; }
    .bubble { max-width: 75%; padding:10px 12px; border-radius:12px; line-height:1.4; white-space:pre-wrap; }
    .me .bubble { background:#2563eb; color:white; border-bottom-right-radius:4px; }
    .bot .bubble { background:#f1f5f9; color:#111; border-bottom-left-radius:4px; }
    .meta { font-size: 11px; color:#777; margin-top:4px; }
    .input { display:flex; gap:10px; padding:12px; border-top:1px solid #eee; }
    input { flex:1; padding:12px; border-radius:10px; border:1px solid #ddd; outline:none; }
    button { padding:12px 16px; border-radius:10px; border:none; background:#111827; color:white; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }

    /* --- NEW: wrapper cho 1 message (time + bubble + meta) --- */
    .msgwrap { margin-bottom: 12px; }

    /* --- NEW: time ở góc trái phía trên bubble --- */
    .time {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 4px 2px;
    }

    /* --- NEW: typing indicator --- */
    .typing {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 14px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
      opacity: 0.4;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.30s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .thinking {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <div class="title">Sunybot</div>
      <div class="sub">Chatbot hỗ trợ thang máy • FAQ từ MySQL • Fallback Ollama</div>
    </div>

    <div class="chat">
      <div id="msgs" class="msgs"></div>
      <div class="input">
        <input id="text" placeholder="Nhập câu hỏi… (VD: Tốc độ thang máy là bao nhiêu? / NV020)" />
        <button id="send">Gửi</button>
      </div>
    </div>
  </div>

<script>
const msgs = document.getElementById("msgs");
const input = document.getElementById("text");
const btn = document.getElementById("send");

function nowHHMM() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${hh}:${mm}`;
}

function addMsg(role, text, meta = "", timeText = null) {
  const wrap = document.createElement("div");
  wrap.className = "msgwrap";

  const t = document.createElement("div");
  t.className = "time";
  t.textContent = timeText || nowHHMM();
  wrap.appendChild(t);

  const row = document.createElement("div");
  row.className = "row " + (role === "me" ? "me" : "bot");

  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;

  row.appendChild(b);
  wrap.appendChild(row);

  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    wrap.appendChild(m);
  }

  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
  return wrap;
}

function addTyping(role = "bot") {
  const wrap = document.createElement("div");
  wrap.className = "msgwrap";

  const t = document.createElement("div");
  t.className = "time";
  t.textContent = nowHHMM();
  wrap.appendChild(t);

  const row = document.createElement("div");
  row.className = "row " + (role === "me" ? "me" : "bot");

  const b = document.createElement("div");
  b.className = "bubble";

  const typing = document.createElement("div");
  typing.className = "typing";

  const dots = document.createElement("div");
  dots.className = "dots";
  dots.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;

  typing.appendChild(dots);
  b.appendChild(typing);

  const thinking = document.createElement("div");
  thinking.className = "thinking";
  thinking.textContent = "đang suy nghĩ";
  b.appendChild(thinking);

  row.appendChild(b);
  wrap.appendChild(row);

  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
  return wrap;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  // User message + timestamp
  addMsg("me", text);

  input.value = "";
  btn.disabled = true;

  // Bot typing indicator
  const typingNode = addTyping("bot");

  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await r.json();

    // Remove typing
    typingNode.remove();

    const meta =
      `source=${data.source}` +
      (data.intent ? ` • intent=${data.intent}` : "") +
      (data.confidence != null ? ` • conf=${Number(data.confidence).toFixed(3)}` : "");

    // Bot answer + timestamp
    addMsg("bot", data.answer, meta);

  } catch (e) {
    typingNode.remove();
    addMsg("bot",
      "Sunybot hien khong the tra loi cau hoi, vui long tra loi cau hoi lien quan",
      "source=FALLBACK"
    );
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

btn.addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

// Welcome message
addMsg("bot", "xin chao toi la sunybot, toi co the giup gi cho ban", "source=DB_PROMPT");
</script>
</body>
</html>
